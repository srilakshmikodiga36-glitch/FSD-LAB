<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Input Methods</title>
</head>
<body>

    <h2>JavaScript Input Methods Demo</h2>

    <!-- 3. Using HTML input field -->
    <label>Enter your name:</label>
    <input type="text" id="nameInput">
    <button onclick="getInput()">Submit</button>

    <p id="result"></p>

    <script>
        // 1. Using prompt()
        let age = prompt("Enter your age:");
        console.log("Age entered using prompt(): " + age);

        // 2. Using confirm()
        let isStudent = confirm("Are you a student?");
        console.log("Student status using confirm(): " + isStudent);

        // 3. Using HTML input field
        function getInput() {
            let name = document.getElementById("nameInput").value;
            document.getElementById("result").innerHTML =
                "Name entered using input field: " + name;
        }
    </script>

</body>
</html>
