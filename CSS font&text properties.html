<!DOCTYPE html>
<html>
<head>
    <title>CSS Font and Text Properties</title>
    <style>
        h1 {
            font-size: 36px;              
            font-weight: bold;            
            text-align: center;           
        }

        p.italicText {
            font-style: italic;      
        }

        p.decoratedText {
            text-decoration: underline;  
         }

        p.transformedText {
            text-transform: uppercase;    
        }

        p.alignedText {
            text-align: left;                  }
    </style>
</head>
<body>

    <h1>CSS Font and Text Example</h1>

    <p class="italicText">This text is italic.</p>

    <p class="decoratedText">This text is underlined.</p>

    <p class="transformedText">This text is transformed to uppercase.</p>

    <p class="alignedText">This text is aligned to the right.</p>

</body>
</html>
