<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model Example</title>
    <style>
        div{
           background-color:red;
           width:300px;
           border:20px solid green;
           padding:30px;
           margin:15px;
       }
   </style>
</head>
<body>
  <h2>Demonstrating the Box Model</h2>
  <p>This text is a content of the box.we have added to 30px padding and 15px margin </p>
  <div>This box model consists of conetent,padding border and margin.The CSS box model is essentially a box that wraps around every HTML element.</div>
</body>
</html>
