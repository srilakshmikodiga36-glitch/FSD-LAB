<!DOCTYPE html>
<html>
<head>
    <title>CSS Color References</title>
    <style>
         .colorName {
            color: red;
        }
        .hexColor {
            color: #0000FF;
        }

        .rgbColor {
            color: rgb(0, 128, 0);
        }

        .rgbaColor {
            color: rgba(255, 0, 0, 0.5);
        }

        .hslColor {
            color: hsl(240, 100%, 50%);
        }

        .hslaColor {
            color: hsla(300, 100%, 50%, 0.5);
        }
    </style>
</head>
<body>

    <h2 class="colorName">This text uses Color Name</h2>
    <h2 class="hexColor">This text uses HEX Value</h2>
    <h2 class="rgbColor">This text uses RGB</h2>
    <h2 class="rgbaColor">This text uses RGBA</h2>
    <h2 class="hslColor">This text uses HSL</h2>
    <h2 class="hslaColor">This text uses HSLA</h2>

</body>
</html>
