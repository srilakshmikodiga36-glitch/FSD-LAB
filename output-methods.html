<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Output Methods Demo</title>
</head>
<body>

    <h2>JavaScript Output Methods Demo</h2>

    <!-- 1. Using innerHTML -->
    <h3>1. Using innerHTML</h3>
    <p id="demo"></p>

    <!-- 2. Using document.write() -->
    <h3>2. Using document.write()</h3>

    <script>
        // Using innerHTML
        document.getElementById("demo").innerHTML =
            "Hello World using innerHTML";

        // Using document.write()
        document.write("Hello World using document.write()");
    </script>

</body>
</html>
