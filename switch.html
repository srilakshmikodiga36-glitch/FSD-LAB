<!DOCTYPE html>
<html>
<head>
<title>Week Days</title>
<script>
function showDay() {
    var day = parseInt(document.getElementById("num").value);
    var result;

    switch(day) {
        case 1:
            result = "Monday";
            break;
        case 2:
            result = "Tuesday";
            break;
        case 3:
            result = "Wednesday";
            break;
        case 4:
            result = "Thursday";
            break;
        case 5:
            result = "Friday";
            break;
        case 6:
            result = "Saturday";
            break;
        case 7:
            result = "Sunday";
            break;
        default:
            result = "Invalid input! Enter number between 1 and 7.";
    }

    document.getElementById("output").innerHTML = result;
}
</script>
</head>

<body>
<h2>Display Week Day</h2>

Enter number (1-7): 
<input type="number" id="num">

<button onclick="showDay()">Show Day</button>

<p id="output"></p>

</body>
</html>
