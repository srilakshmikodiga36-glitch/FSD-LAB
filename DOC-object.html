<!DOCTYPE html>
<html>
<head>
<title>Document Object Example</title>

<script>
function changeContent()
{
    document.bgColor = "blue";                 // document property
    document.getElementById("msg").innerHTML = "Welcome to JavaScript Document Object!";
}
</script>

</head>

<body>

<h2 id="msg">Click the button to see Document Object in action</h2>

<button onclick="changeContent()">Click Here</button>

</body>
</html>
